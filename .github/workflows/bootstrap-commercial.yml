name: Commercial CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm run typecheck

      - name: Commercial contract tests
        run: pnpm test

      - name: Self-improve smoke
        run: node scripts/selfimprove/smoke.mjs

      - name: Security scan
        run: pnpm run security

      - name: Production build
        run: pnpm run build
